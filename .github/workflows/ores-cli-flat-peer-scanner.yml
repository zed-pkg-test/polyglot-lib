name: ores-cli flat peer scanner certificate

on:
  pull_request:
    paths:
      - '.github/workflows/ores-cli-flat-peer-scanner.yml'
      - 'certification/ores-cli-flat-peer-scanner/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CERT_ROOT: certification/ores-cli-flat-peer-scanner
  PRODUCT_HEAD: 9e5805fc96df998e2b0e6e7aea64b620e50f80a8
  PRODUCT_BLOB: 461f582984077390f4d272ab66e3d0b56838924e

jobs:
  certify-exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact certificate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ores-cli-flat-peer-scanner.yml

      - name: Prove exact product source and authority lock
        shell: bash
        run: |
          set -Eeuo pipefail
          module="$CERT_ROOT/src/audit/split_peer_contracts.rs"
          lock="$CERT_ROOT/source-lock.json"
          test "$(git hash-object "$module")" = "$PRODUCT_BLOB"
          jq -e --arg head "$PRODUCT_HEAD" --arg blob "$PRODUCT_BLOB" '
            .repository == "ORESoftware/ores-cli" and
            .pullRequest == 254 and
            .productHead == $head and
            .files["src/audit/split_peer_contracts.rs"] == $blob and
            .authorityModel.typespec == "independently-authored-first-class" and
            .authorityModel.jsonSchema == "independently-authored-first-class" and
            .authorityModel.typespecProjection == "generated-json-schema-b" and
            .authorityModel.generatedJsonSchema == "comparison-evidence-only" and
            .authorityModel.comparison == "generated-b-vs-authored-a" and
            .authorityModel.precedence == "none"
          ' "$lock"
          grep -Fq 'independent authored peers' "$module"
          grep -Fq 'comparison-only Schema B' "$module"
          grep -Fq 'authored Schema A' "$module"
          grep -Fq 'split-authored-json-schema-missing' "$module"
          grep -Fq 'split-typespec-source-missing' "$module"

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Require formatting
        run: cargo +1.95.0 fmt --manifest-path "$CERT_ROOT/Cargo.toml" --all -- --check

      - name: Compile exact scanner
        run: cargo +1.95.0 check --manifest-path "$CERT_ROOT/Cargo.toml" --all-targets

      - name: Run exact embedded scanner regressions
        run: cargo +1.95.0 test --manifest-path "$CERT_ROOT/Cargo.toml" --all-targets -- --nocapture

      - name: Deny Clippy warnings
        run: cargo +1.95.0 clippy --manifest-path "$CERT_ROOT/Cargo.toml" --all-targets -- -D warnings

      - name: Repeat exact regressions optimized
        run: cargo +1.95.0 test --release --manifest-path "$CERT_ROOT/Cargo.toml" --all-targets

      - name: Prove source immutability
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object "$CERT_ROOT/src/audit/split_peer_contracts.rs")" = "$PRODUCT_BLOB"
          git diff --exit-code -- "$CERT_ROOT" .github/workflows/ores-cli-flat-peer-scanner.yml
