name: certify Shared Auth fail-closed passwordless consume

on:
  pull_request:
    paths:
      - '.github/workflows/certify-shared-auth-passwordless.yml'
      - 'evidence/shared-auth-passwordless.json'
      - 'certification/shared-auth-passwordless/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact certification head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact production source and security invariants
        shell: bash
        run: |
          set -euo pipefail
          vendor=certification/shared-auth-passwordless/vendor/passwordless.rs
          test "$(git hash-object "$vendor")" = '73832cedbf35798eabc4f222ffc51f4607380236'
          jq -e '
            .repository == "shared-auth/shared-auth-server.rs"
            and .pullRequest == 151
            and .productHead == "ff3f2f6f20ad7e5b6048b803590740718b7d59cc"
            and .sourceBlob == "73832cedbf35798eabc4f222ffc51f4607380236"
            and .security.consumeShape == "email-plus-otp-only"
            and .security.unknownFields == "rejected"
            and .security.legacyTokenDispatch == "absent"
            and .security.retainedLegacyHelper == "unauthorized"
          ' evidence/shared-auth-passwordless.json >/dev/null
          grep -Fq '#[serde(deny_unknown_fields)]' "$vendor"
          grep -Fq 'fn consume_body_accepts_only_email_and_otp()' "$vendor"
          grep -Fq 'Err(AuthError::Unauthorized)' "$vendor"
          ! grep -Fq 'request.token.as_deref()' "$vendor"
          ! grep -Fq 'provide either a legacy token or email with six-digit otp' "$vendor"

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Execute independent behavior canary
        shell: bash
        run: |
          set -euo pipefail
          manifest=certification/shared-auth-passwordless/Cargo.toml
          cargo fmt --manifest-path "$manifest" --all -- --check
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          cargo test --manifest-path "$manifest" --all-targets
          cargo test --release --manifest-path "$manifest" --all-targets

      - name: Require fail-closed behavior inventory
        shell: bash
        run: |
          set -euo pipefail
          manifest=certification/shared-auth-passwordless/Cargo.toml
          tests="$(cargo test --manifest-path "$manifest" --all-targets -- --list)"
          for name in \
            accepts_email_and_otp_only \
            rejects_legacy_token_only_body \
            rejects_mixed_otp_and_legacy_token_body \
            retained_legacy_handler_is_fail_closed
          do
            grep -Fq "$name" <<<"$tests"
          done
          ! grep -RInE 'ghp_|github_pat_|lin_api_|AKIA[0-9A-Z]{16}|terraform[[:space:]]+apply|kubectl[[:space:]]+(apply|delete)' \
            certification/shared-auth-passwordless evidence/shared-auth-passwordless.json

      - name: Preserve exact certification sources
        run: git diff --exit-code -- .github/workflows/certify-shared-auth-passwordless.yml evidence/shared-auth-passwordless.json certification/shared-auth-passwordless
