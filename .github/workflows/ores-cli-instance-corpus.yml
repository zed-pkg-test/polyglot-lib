name: ores-cli TJSV instance corpus canary

on:
  pull_request:
    paths:
      - '.github/workflows/ores-cli-instance-corpus.yml'
      - 'certification/ores-cli-instance-corpus/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-instance-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORES_CLI_CANDIDATE: 565c4dfd3dfa85cfc197f5629f1894ecd4b97b1d
  ORES_CLI_CORPUS_BLOB: 66ded46759f5404c379d5fea16d3ee2ac0eb65e5
  CERT_ROOT: certification/ores-cli-instance-corpus

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ores-cli-instance-corpus.yml

      - name: Prove peer-authority and corpus policy lock
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e --arg sha "$ORES_CLI_CANDIDATE" --arg blob "$ORES_CLI_CORPUS_BLOB" '
            .schema == "ores.test.source-lock/v1" and
            .repository == "ORESoftware/ores-cli" and
            .pullRequest == 274 and
            .commit == $sha and
            .focusBlob == $blob and
            .authorityModel.typespec == "independently-authored-first-class" and
            .authorityModel.jsonSchema == "independently-authored-draft-2020-12-first-class" and
            .authorityModel.typespecProjection == "generated-json-schema-b" and
            .authorityModel.generatedJsonSchema == "comparison-evidence-only" and
            .authorityModel.comparison == "generated-b-vs-authored-a" and
            .authorityModel.precedence == "none" and
            .corpusPolicy.pairedValidInvalidClasses == true and
            .corpusPolicy.semanticAdmissionOwnedByTjsv == true
          ' "$CERT_ROOT/source-lock.json"

      - name: Fetch exact public product head without credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir product
          git -C product init -q
          git -C product remote add origin https://github.com/ORESoftware/ores-cli.git
          git -C product -c credential.helper= fetch --depth=1 origin "$ORES_CLI_CANDIDATE"
          git -C product checkout -q --detach FETCH_HEAD
          test "$(git -C product rev-parse HEAD)" = "$ORES_CLI_CANDIDATE"
          test "$(git -C product hash-object src/audit/contract_instance_corpus.rs)" = "$ORES_CLI_CORPUS_BLOB"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Require focused source formatting
        working-directory: product
        run: rustfmt +1.95.0 --check src/audit/contract_instance_corpus.rs

      - name: Deny library warnings
        working-directory: product
        run: cargo +1.95.0 clippy --lib --all-features --locked -- -D warnings

      - name: Run full library tests
        working-directory: product
        run: cargo +1.95.0 test --lib --all-features --locked

      - name: Run exact instance-corpus regressions
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo +1.95.0 test --lib --all-features --locked contract_instance_corpus -- --nocapture
          grep -Fq 'paired TJSV corpus is missing its' src/audit/contract_instance_corpus.rs
          grep -Fq 'contract-instance-fixture-class-empty' src/audit/contract_instance_corpus.rs
          grep -Fq 'contract-instance-fixture-invalid-json' src/audit/contract_instance_corpus.rs
          grep -Fq 'TJSV owns semantic instance admission' src/audit/contract_instance_corpus.rs
          grep -Fq 'contract_instance_corpus::augment_contract_instance_corpus_audit' src/audit/mod.rs

      - name: Require peer authorities to remain distinct from generated evidence
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'main.tsp' src/audit/contract_instance_corpus.rs
          grep -Fq 'authored.schema.json' src/audit/contract_instance_corpus.rs
          test "$(git hash-object src/audit/contract_instance_corpus.rs)" = "$ORES_CLI_CORPUS_BLOB"

      - name: Prove product checkout remained immutable
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ORES_CLI_CANDIDATE"
          test -z "$(git status --porcelain --untracked-files=no)"
