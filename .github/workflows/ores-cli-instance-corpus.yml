name: ores-cli TJSV instance corpus canary

on:
  pull_request:
    paths:
      - '.github/workflows/ores-cli-instance-corpus.yml'
      - 'certification/ores-cli-instance-corpus/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-instance-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORES_CLI_CANDIDATE: 998b86537e9b647253005626f7210a4954a105cb
  ORES_CLI_CORPUS_BLOB: a24956d314afad18ffe5f1c976b32b05a2e8037c
  CERT_ROOT: certification/ores-cli-instance-corpus

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ores-cli-instance-corpus.yml

      - name: Prove exact source and peer-authority policy lock
        shell: bash
        run: |
          set -Eeuo pipefail
          module="$CERT_ROOT/src/audit/contract_instance_corpus.rs"
          test "$(git hash-object "$module")" = "$ORES_CLI_CORPUS_BLOB"
          jq -e --arg sha "$ORES_CLI_CANDIDATE" --arg blob "$ORES_CLI_CORPUS_BLOB" '
            .schema == "ores.test.source-lock/v1" and
            .repository == "ORESoftware/ores-cli" and
            .pullRequest == 274 and
            .commit == $sha and
            .focusBlob == $blob and
            .certificate.mode == "byte-identical-product-mirror" and
            .authorityModel.typespec == "independently-authored-first-class" and
            .authorityModel.jsonSchema == "independently-authored-draft-2020-12-first-class" and
            .authorityModel.typespecProjection == "generated-json-schema-b" and
            .authorityModel.generatedJsonSchema == "comparison-evidence-only" and
            .authorityModel.comparison == "generated-b-vs-authored-a" and
            .authorityModel.precedence == "none" and
            .corpusPolicy.pairedValidInvalidClasses == true and
            .corpusPolicy.semanticAdmissionOwnedByTjsv == true
          ' "$CERT_ROOT/source-lock.json"
          grep -Fq 'TJSV owns semantic instance admission' "$module"
          grep -Fq 'paired TJSV corpus is missing its' "$module"
          grep -Fq 'authored.schema.json' "$module"
          grep -Fq 'main.tsp' "$module"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Require exact product module formatting
        run: rustfmt +1.95.0 --check "$CERT_ROOT/src/audit/contract_instance_corpus.rs"

      - name: Compile exact mirrored module
        run: cargo +1.95.0 check --manifest-path "$CERT_ROOT/Cargo.toml" --all-targets

      - name: Run all embedded corpus regressions
        run: cargo +1.95.0 test --manifest-path "$CERT_ROOT/Cargo.toml" --all-targets -- --nocapture

      - name: Deny warnings under Clippy
        run: cargo +1.95.0 clippy --manifest-path "$CERT_ROOT/Cargo.toml" --all-targets -- -D warnings

      - name: Repeat corpus regressions optimized
        run: cargo +1.95.0 test --release --manifest-path "$CERT_ROOT/Cargo.toml" --all-targets

      - name: Prove mirrored source remained immutable
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object "$CERT_ROOT/src/audit/contract_instance_corpus.rs")" = "$ORES_CLI_CORPUS_BLOB"
          git diff --exit-code -- "$CERT_ROOT" .github/workflows/ores-cli-instance-corpus.yml
