name: ores-cli TJSV invocation scope canary

on:
  pull_request:
    paths:
      - '.github/workflows/ores-cli-tjsv-invocation-scope.yml'
      - 'certification/ores-cli-tjsv-invocation-scope/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-tjsv-invocation-scope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORES_CLI_CANDIDATE: 165176768e2ab397cdc541c550d8a6fa553f7127
  ORES_CLI_SCOPE_MODULE_BLOB: 9b7163abfa2c1a9208a48cc5af95ce81e22b2441
  ORES_CLI_AUDIT_MOD_BLOB: cd355a7e8f9d3d5d6d0f169ebdcc1313c4411f19
  CERT_ROOT: certification/ores-cli-tjsv-invocation-scope

jobs:
  certify-product-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate canary workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ores-cli-tjsv-invocation-scope.yml

      - name: Validate immutable source lock and peer-authority policy
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e --arg commit "$ORES_CLI_CANDIDATE" \
            --arg module "$ORES_CLI_SCOPE_MODULE_BLOB" \
            --arg dispatcher "$ORES_CLI_AUDIT_MOD_BLOB" '
              .schema == "ores.test.source-lock/v1" and
              .repository == "ORESoftware/ores-cli" and
              .pullRequest == 231 and
              .commit == $commit and
              .files["src/audit/tjsv_invocation_scope.rs"] == $module and
              .files["src/audit/mod.rs"] == $dispatcher and
              .authorityModel.typespec == "independently-authored-first-class" and
              .authorityModel.jsonSchema == "independently-authored-first-class" and
              .authorityModel.typespecProjection == "generated-json-schema-b" and
              .authorityModel.generatedJsonSchema == "comparison-evidence-only" and
              .authorityModel.comparison == "generated-b-vs-authored-a" and
              .authorityModel.precedence == "none"
            ' "$CERT_ROOT/source-lock.json"

      - name: Check out exact ores-cli product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-cli
          ref: ${{ env.ORES_CLI_CANDIDATE }}
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact product revision and source blobs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$ORES_CLI_CANDIDATE"
          test "$(git -C product hash-object src/audit/tjsv_invocation_scope.rs)" = "$ORES_CLI_SCOPE_MODULE_BLOB"
          test "$(git -C product hash-object src/audit/mod.rs)" = "$ORES_CLI_AUDIT_MOD_BLOB"
          grep -Fqx 'mod tjsv_invocation_scope;' product/src/audit/mod.rs
          grep -Fqx 'mod tjsv_workflow_revision;' product/src/audit/mod.rs
          grep -Fq 'tjsv_full_check::augment_tjsv_full_check_audit(options, report)' product/src/audit/mod.rs
          grep -Fq 'tjsv_invocation_scope::augment_tjsv_invocation_scope_audit(options, report)' product/src/audit/mod.rs
          grep -Fq 'tjsv_workflow_revision::augment_tjsv_workflow_revision_audit(options, report)' product/src/audit/mod.rs

      - name: Prove first-class TypeSpec and JSON Schema semantics in source
        shell: bash
        run: |
          set -Eeuo pipefail
          module=product/src/audit/tjsv_invocation_scope.rs
          grep -Fq 'TypeSpec and Draft 2020-12 JSON Schema remain independent, first-class' "$module"
          grep -Fq 'generated Schema B' "$module"
          grep -Fq 'independently authored Schema A' "$module"
          grep -Fq 'tjsv-full-check-cross-step-stitching' "$module"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Require product formatting
        run: cargo +1.90.0 fmt --manifest-path product/Cargo.toml --all -- --check

      - name: Compile real product crate
        run: cargo +1.90.0 check --manifest-path product/Cargo.toml --all-targets

      - name: Run scoped TJSV invocation regressions
        run: cargo +1.90.0 test --manifest-path product/Cargo.toml tjsv_invocation_scope -- --nocapture

      - name: Re-run adjacent full-check regressions
        run: cargo +1.90.0 test --manifest-path product/Cargo.toml tjsv_full_check -- --nocapture

      - name: Re-run adjacent revision-consistency regressions
        run: cargo +1.90.0 test --manifest-path product/Cargo.toml tjsv_workflow_revision -- --nocapture

      - name: Deny warnings under Clippy
        run: cargo +1.90.0 clippy --manifest-path product/Cargo.toml --all-targets -- -D warnings

      - name: Prove product and certificate stayed immutable
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product diff --exit-code
          git diff --exit-code -- "$CERT_ROOT" .github/workflows/ores-cli-tjsv-invocation-scope.yml
