name: ores-cli runtime env contract certificate

on:
  pull_request:
    paths:
      - '.github/workflows/ores-cli-runtime-env-contract.yml'
      - 'certification/ores-cli-runtime-env-contract/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CERT_ROOT: certification/ores-cli-runtime-env-contract
  PRODUCT_HEAD: 2465cad4df82f02ca5a4b01b4838e9a4b84b4ac5
  PRODUCT_BLOB: de00ea4c9d79c4c8b9da59a11b22737df42f9ec9

jobs:
  certify-exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact certificate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ores-cli-runtime-env-contract.yml

      - name: Prove exact product source and authority lock
        shell: bash
        run: |
          set -Eeuo pipefail
          module="$CERT_ROOT/src/runtime_env_contract.rs"
          lock="$CERT_ROOT/source-lock.json"
          test "$(git hash-object "$module")" = "$PRODUCT_BLOB"
          jq -e --arg head "$PRODUCT_HEAD" --arg blob "$PRODUCT_BLOB" '
            .repository == "ORESoftware/ores-cli" and
            .pullRequest == 277 and
            .productHead == $head and
            .files["src/audit/runtime_env_contract.rs"] == $blob and
            .authorityModel.cliFlags == "flags2env-public-and-control-authority" and
            .authorityModel.runtimeTomls == "registered-runtime-policy-authority" and
            .authorityModel.sourceAst == "verification-only" and
            .authorityModel.derivedInventory == "evidence-only" and
            .authorityModel.valuesRead == false and
            .authorityModel.literalDefaultsRead == false
          ' "$lock"
          grep -Fq 'REGISTERED_RUNTIME_CONFIGS' "$module"
          grep -Fq 'runtimeEnvRequiredKeys' "$module"
          grep -Fq 'runtimeEnvRequirednessUnspecifiedKeys' "$module"
          grep -Fq 'runtimeEnvSecretKeys' "$module"
          grep -Fq 'runtimeEnvValuesRead' "$module"
          grep -Fq 'runtimeEnvLiteralDefaultsRead' "$module"

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Require formatting
        run: cargo +1.95.0 fmt --manifest-path "$CERT_ROOT/Cargo.toml" --all -- --check

      - name: Compile exact runtime env contract
        run: cargo +1.95.0 check --manifest-path "$CERT_ROOT/Cargo.toml" --all-targets

      - name: Run exact embedded runtime env regressions
        run: cargo +1.95.0 test --manifest-path "$CERT_ROOT/Cargo.toml" --all-targets -- --nocapture

      - name: Deny Clippy warnings
        run: cargo +1.95.0 clippy --manifest-path "$CERT_ROOT/Cargo.toml" --all-targets -- -D warnings

      - name: Repeat exact regressions optimized
        run: cargo +1.95.0 test --release --manifest-path "$CERT_ROOT/Cargo.toml" --all-targets

      - name: Prove source immutability
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object "$CERT_ROOT/src/runtime_env_contract.rs")" = "$PRODUCT_BLOB"
          git diff --exit-code -- "$CERT_ROOT" .github/workflows/ores-cli-runtime-env-contract.yml
