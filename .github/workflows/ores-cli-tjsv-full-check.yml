name: ores-cli TJSV full-check certificate

on:
  pull_request:
    paths:
      - ".github/workflows/ores-cli-tjsv-full-check.yml"
      - "certification/ores-cli-tjsv-full-check/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ores-cli-tjsv-full-check.yml"
      - "certification/ores-cli-tjsv-full-check/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-tjsv-full-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  MANIFEST: certification/ores-cli-tjsv-full-check/Cargo.toml
  LOCKFILE: certification/ores-cli-tjsv-full-check/Cargo.lock
  SOURCE_LOCK: certification/ores-cli-tjsv-full-check/source-lock.json

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact test candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
          show-progress: false

      - name: Verify exact candidate and provenance boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          jq -e '
            .schema == "zed-pkg-test.ores-cli-tjsv-full-check/v1" and
            .upstream.repository == "ORESoftware/ores-cli" and
            .upstream.pullRequest == 177 and
            (.upstream.head | test("^[0-9a-f]{40}$")) and
            .upstream.path == "src/audit/tjsv_full_check.rs" and
            (.upstream.blob | test("^[0-9a-f]{40}$")) and
            .mirror.path == "src/tjsv_full_check.rs" and
            .mirror.scope == "executable-production-prefix-before-cfg-test-module" and
            .contract.typespecAuthority == "independently-authored" and
            .contract.jsonSchemaAuthority == "independently-authored" and
            .contract.generatedJsonSchemaRole == "comparison-evidence-only" and
            .contract.authorityPrecedence == "none"
          ' "$SOURCE_LOCK"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Bootstrap deterministic dependency lock for review
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path "$MANIFEST"
          echo '----- BEGIN CERTIFICATE CARGO.LOCK -----'
          cat "$LOCKFILE"
          echo '----- END CERTIFICATE CARGO.LOCK -----'

      - name: Check formatting
        run: cargo fmt --manifest-path "$MANIFEST" -- --check

      - name: Compile and execute production scanner plus adversarial cases
        run: cargo test --manifest-path "$MANIFEST" --all-targets

      - name: Lint certificate harness
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings

      - name: Prove source mirror and harness stayed immutable
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- \
            certification/ores-cli-tjsv-full-check/Cargo.toml \
            certification/ores-cli-tjsv-full-check/source-lock.json \
            certification/ores-cli-tjsv-full-check/src

      - name: Retain bootstrap lock for review
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ores-cli-tjsv-full-check-lock-${{ github.run_id }}
          path: ${{ env.LOCKFILE }}
          if-no-files-found: warn
          retention-days: 7
