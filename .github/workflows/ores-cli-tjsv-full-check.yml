name: ores-cli TJSV full-check canary

on:
  pull_request:
    paths:
      - 'canaries/ores-cli-tjsv-full-check/**'
      - '.github/workflows/ores-cli-tjsv-full-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-tjsv-full-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORES_CLI_CANDIDATE: 6e29a4e0650ef2fd84432b835caf16810710b6bf
  ORES_CLI_TJSV_FULL_CHECK_BLOB: 60e851132201be94fdd14d92939e88600c74adc7
  ORES_CLI_AUDIT_MOD_BLOB: a547409915bb9796fa28adc61a70f76f8765e99c

jobs:
  certify-exact-product-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact review head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate canary workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ores-cli-tjsv-full-check.yml

      - name: Check out exact current ores-cli candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-cli
          ref: ${{ env.ORES_CLI_CANDIDATE }}
          path: product
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Prove and stage exact current product sources
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$ORES_CLI_CANDIDATE"
          test "$(git -C product hash-object src/audit/tjsv_full_check.rs)" = "$ORES_CLI_TJSV_FULL_CHECK_BLOB"
          test "$(git -C product hash-object src/audit/mod.rs)" = "$ORES_CLI_AUDIT_MOD_BLOB"
          grep -Fqx 'mod tjsv_full_check;' product/src/audit/mod.rs
          grep -Fq 'tjsv_full_check::augment_tjsv_full_check_audit(options, report)' product/src/audit/mod.rs
          cp product/src/audit/tjsv_full_check.rs canaries/ores-cli-tjsv-full-check/src/audit/tjsv_full_check.rs
          cp product/src/audit/mod.rs canaries/ores-cli-tjsv-full-check/product-audit-mod.rs
          test "$(git hash-object canaries/ores-cli-tjsv-full-check/src/audit/tjsv_full_check.rs)" = "$ORES_CLI_TJSV_FULL_CHECK_BLOB"
          test "$(git hash-object canaries/ores-cli-tjsv-full-check/product-audit-mod.rs)" = "$ORES_CLI_AUDIT_MOD_BLOB"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Format exact current module and canary harness
        run: cargo +1.90.0 fmt --manifest-path canaries/ores-cli-tjsv-full-check/Cargo.toml --all -- --check

      - name: Compile exact current product slice
        run: cargo +1.90.0 check --manifest-path canaries/ores-cli-tjsv-full-check/Cargo.toml --all-targets

      - name: Run exact embedded product regressions
        run: cargo +1.90.0 test --manifest-path canaries/ores-cli-tjsv-full-check/Cargo.toml --all-targets

      - name: Deny warnings under Clippy
        run: cargo +1.90.0 clippy --manifest-path canaries/ores-cli-tjsv-full-check/Cargo.toml --all-targets -- -D warnings

      - name: Repeat regressions optimized
        run: cargo +1.90.0 test --release --manifest-path canaries/ores-cli-tjsv-full-check/Cargo.toml --all-targets

      - name: Prove product checkout remained immutable
        run: git -C product diff --exit-code -- .
