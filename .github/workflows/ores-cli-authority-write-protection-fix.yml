name: ores-cli authority write-protection repair

on:
  pull_request:
    paths:
      - '.github/workflows/ores-cli-authority-write-protection-fix.yml'
      - 'certification/ores-cli-authority-write-protection-fix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-authority-write-protection-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORES_CLI_CANDIDATE: dafa0977dd030c3d8b85f09e5902ffda745c0910
  ORES_CLI_MODULE_BLOB: b6c92b3bff79252eb67fac57094d7cc1249e5b66
  CERT_ROOT: certification/ores-cli-authority-write-protection-fix

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ores-cli-authority-write-protection-fix.yml

      - name: Prove exact source and first-class peer authority policy
        shell: bash
        run: |
          set -Eeuo pipefail
          module="$CERT_ROOT/src/audit/authority_write_protection.rs"
          test "$(git hash-object "$module")" = "$ORES_CLI_MODULE_BLOB"
          jq -e --arg sha "$ORES_CLI_CANDIDATE" --arg blob "$ORES_CLI_MODULE_BLOB" '
            .schema == "ores.test.source-lock/v1" and
            .repository == "ORESoftware/ores-cli" and
            .pullRequest == 276 and
            .commit == $sha and
            .focusBlob == $blob and
            .certificate.mode == "byte-identical-product-mirror" and
            .authorityModel.typespec == "independently-authored-first-class" and
            .authorityModel.jsonSchema == "independently-authored-draft-2020-12-first-class" and
            .authorityModel.typespecProjection == "generated-json-schema-b" and
            .authorityModel.generatedJsonSchema == "comparison-evidence-only" and
            .authorityModel.comparison == "generated-b-vs-authored-a" and
            .authorityModel.precedence == "none"
          ' "$CERT_ROOT/source-lock.json"
          grep -Fq 'Copying an authored peer *out* to a distinct file' "$module"
          grep -Fq 'allows_copying_authored_peers_into_negative_control_fixtures' "$module"
          grep -Fq 'still_rejects_copy_move_and_install_that_can_replace_authored_peers' "$module"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Require formatting
        run: cargo +1.95.0 fmt --manifest-path "$CERT_ROOT/Cargo.toml" --all -- --check

      - name: Compile exact mirrored module
        run: cargo +1.95.0 check --manifest-path "$CERT_ROOT/Cargo.toml" --all-targets

      - name: Run all embedded authority-write regressions
        run: cargo +1.95.0 test --manifest-path "$CERT_ROOT/Cargo.toml" --all-targets -- --nocapture

      - name: Deny warnings under Clippy
        run: cargo +1.95.0 clippy --manifest-path "$CERT_ROOT/Cargo.toml" --all-targets -- -D warnings

      - name: Repeat regressions optimized
        run: cargo +1.95.0 test --release --manifest-path "$CERT_ROOT/Cargo.toml" --all-targets

      - name: Prove mirrored source remained immutable
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object "$CERT_ROOT/src/audit/authority_write_protection.rs")" = "$ORES_CLI_MODULE_BLOB"
          git diff --exit-code -- "$CERT_ROOT" .github/workflows/ores-cli-authority-write-protection-fix.yml
