name: ores-cli TJSV full-check adversarial certificate

on:
  pull_request:
    paths:
      - ".github/workflows/ores-cli-tjsv-full-check-certificate.yml"
      - "certification/ores-cli-tjsv-full-check/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ores-cli-tjsv-full-check-certificate.yml"
      - "certification/ores-cli-tjsv-full-check/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-tjsv-full-check-certificate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  MANIFEST: certification/ores-cli-tjsv-full-check/Cargo.toml
  LOCKFILE: certification/ores-cli-tjsv-full-check/Cargo.lock
  SOURCE_LOCK: certification/ores-cli-tjsv-full-check/source-lock.json
  MIRROR: certification/ores-cli-tjsv-full-check/src/tjsv_full_check.rs
  PRODUCT_TESTS: certification/ores-cli-tjsv-full-check/src/audit/tjsv_full_check_tests.rs
  PRODUCT_AUDIT_MOD: certification/ores-cli-tjsv-full-check/product-audit-mod.rs

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact test candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
          show-progress: false

      - name: Validate certificate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ores-cli-tjsv-full-check-certificate.yml

      - name: Verify exact candidate provenance tests and audit wiring
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -d certification/ores-cli-tjsv-full-check/src/audit
          test -s certification/ores-cli-tjsv-full-check/src/audit/README.md
          jq -e '
            .schema == "zed-pkg-test.ores-cli-tjsv-full-check/v1" and
            .upstream.repository == "ORESoftware/ores-cli" and
            .upstream.pullRequest == 223 and
            .upstream.head == "abe5f6740f937b2e545d41463a1a5c75c7159a44" and
            .upstream.path == "src/audit/tjsv_full_check.rs" and
            .upstream.blob == "a99fb6989e78ac043c485cc62b5ea46a7919639e" and
            .mirror.path == "src/tjsv_full_check.rs" and
            .mirror.blob == "a99fb6989e78ac043c485cc62b5ea46a7919639e" and
            .mirror.scope == "exact-upstream-file" and
            .productIntegration.auditModule.upstreamPath == "src/audit/mod.rs" and
            .productIntegration.auditModule.mirrorPath == "product-audit-mod.rs" and
            .productIntegration.auditModule.blob == "37bd7064652b3ef17f75b716777728ed39c7b0d2" and
            .productIntegration.regressionTests.upstreamPath == "src/audit/tjsv_full_check_tests.rs" and
            .productIntegration.regressionTests.mirrorPath == "src/audit/tjsv_full_check_tests.rs" and
            .productIntegration.regressionTests.blob == "0c9b7040c1596121ea91af8d45e51ea8299f386b" and
            .contract.typespecAuthority == "independently-authored" and
            .contract.jsonSchemaAuthority == "independently-authored" and
            .contract.generatedJsonSchemaRole == "comparison-evidence-only" and
            .contract.authorityPrecedence == "none"
          ' "$SOURCE_LOCK"
          test "$(git hash-object "$MIRROR")" = 'a99fb6989e78ac043c485cc62b5ea46a7919639e'
          test "$(git hash-object "$PRODUCT_TESTS")" = '0c9b7040c1596121ea91af8d45e51ea8299f386b'
          test "$(git hash-object "$PRODUCT_AUDIT_MOD")" = '37bd7064652b3ef17f75b716777728ed39c7b0d2'
          grep -Fqx 'mod tjsv_full_check;' "$PRODUCT_AUDIT_MOD"
          grep -Fqx 'mod tjsv_full_check_tests;' "$PRODUCT_AUDIT_MOD"
          generated_line="$(grep -nF 'contract_generated_evidence::augment_contract_generated_evidence_audit(' "$PRODUCT_AUDIT_MOD" | head -1 | cut -d: -f1)"
          full_line="$(grep -nF 'tjsv_full_check::augment_tjsv_full_check_audit(options, report)' "$PRODUCT_AUDIT_MOD" | head -1 | cut -d: -f1)"
          drift_line="$(grep -nF 'tjsv_bidirectional_drift::augment_tjsv_bidirectional_drift_audit(options, report)' "$PRODUCT_AUDIT_MOD" | head -1 | cut -d: -f1)"
          test "$generated_line" -lt "$full_line"
          test "$full_line" -lt "$drift_line"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Verify committed dependency closure
        shell: bash
        run: |
          set -euo pipefail
          test -s "$LOCKFILE"
          cargo metadata --manifest-path "$MANIFEST" --locked --no-deps --format-version 1 > /dev/null

      - name: Check formatting
        run: cargo fmt --manifest-path "$MANIFEST" -- --check

      - name: Compile and execute exact product regressions plus adversarial cases
        run: cargo test --manifest-path "$MANIFEST" --all-targets --locked

      - name: Lint certificate harness
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets --locked -- -D warnings

      - name: Prove source mirrors lock and harness stayed immutable
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- \
            certification/ores-cli-tjsv-full-check/Cargo.toml \
            certification/ores-cli-tjsv-full-check/Cargo.lock \
            certification/ores-cli-tjsv-full-check/source-lock.json \
            certification/ores-cli-tjsv-full-check/product-audit-mod.rs \
            certification/ores-cli-tjsv-full-check/src
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain certificate lock
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ores-cli-tjsv-full-check-lock-${{ github.run_id }}
          path: ${{ env.LOCKFILE }}
          if-no-files-found: warn
          retention-days: 7
