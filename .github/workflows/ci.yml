name: package CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ci.yml .github/workflows/contract.yml
      - name: Every target resolves to a subtree whose manifest agrees
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, tomllib
          from pathlib import Path
          with Path('.zpkg.toml').open('rb') as handle:
              zed = tomllib.load(handle)
          package = zed['package']; targets = zed['targets']; version = package['version']
          assert package['org'] == 'zedtest'
          assert set(targets) == {'nodejs', 'python', 'golang', 'rust'}
          for name, target in targets.items():
              directory = Path(target['dir'])
              assert directory.is_dir() and any(directory.rglob('*')), name
          node = json.loads(Path(targets['nodejs']['dir'], 'package.json').read_text())
          assert node['version'] == version and node['license'] == package['license']
          with Path(targets['python']['dir'], 'pyproject.toml').open('rb') as handle:
              assert tomllib.load(handle)['project']['version'] == version
          with Path(targets['rust']['dir'], 'Cargo.toml').open('rb') as handle:
              rust = tomllib.load(handle)['package']
          assert rust['version'] == version and rust['license'] == package['license']
          assert 'module github.com/zed-pkg-test/polyglot-lib/langs/go' in Path(targets['golang']['dir'], 'go.mod').read_text()
          PY
      - name: No slice reaches into another slice
        run: |
          set -euo pipefail
          if grep -rn -E '\.\./(node|python|go|rust)/' node python go rust; then
            echo '::error::a language slice imports across subtrees' >&2
            exit 1
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Node slice
        working-directory: langs/node
        run: |
          set -euo pipefail
          node <<'NODE'
          const lib = require('./index.js');
          if (lib.LANGUAGE !== 'nodejs') throw new Error(`got ${lib.LANGUAGE}`);
          if (lib.greet('ci') !== 'hello ci from polyglot-lib/node') throw new Error(lib.greet('ci'));
          NODE
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Python slice
        working-directory: langs/python
        run: |
          set -euo pipefail
          python -c 'import polyglot_lib; assert polyglot_lib.LANGUAGE == "python"; assert polyglot_lib.greet("ci") == "hello ci from polyglot-lib/python"'
          python -m pip install --quiet build
          python -m build --wheel --outdir "$RUNNER_TEMP/py-dist"
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed
        with:
          go-version: '1.22'
          cache: false
      - name: Go slice
        working-directory: langs/go
        run: |
          go vet ./...
          go build ./...
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - name: Rust slice
        working-directory: langs/rust
        run: |
          cargo build
          cargo test
